
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="M&S BOUTIQUE — La mode qui révèle ta personnalité.">
<title>M&S BOUTIQUE | Mode & Élégance</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --purple:#633b91;
  --deep:#30243b;
  --lavender:#f3edf8;
  --white:#fff;
  --muted:#817889;
  --border:#eee8f3;
  --ease:cubic-bezier(.2,.8,.2,1);
}

*{margin:0;padding:0;box-sizing:border-box}

html{
  scroll-behavior:smooth;
  scroll-padding-top:90px;
}

body{
  font-family:'DM Sans',sans-serif;
  color:var(--deep);
  background:white;
  overflow-x:hidden;
  perspective:1200px;
}

a{text-decoration:none;color:inherit}
button,input{font:inherit}
button{cursor:pointer}

/* HALOS D'AMBIANCE */

body::before,
body::after{
  content:"";
  position:fixed;
  z-index:-1;
  pointer-events:none;
  border-radius:50%;
  filter:blur(45px);
}

body::before{
  width:230px;
  height:230px;
  top:24%;
  left:-150px;
  background:rgba(181,139,220,.17);
  animation:ambientOne 16s ease-in-out infinite alternate;
}

body::after{
  width:260px;
  height:260px;
  right:-170px;
  top:65%;
  background:rgba(217,193,239,.2);
  animation:ambientTwo 19s ease-in-out infinite alternate;
}

/* BARRE DU HAUT */

.topbar{
  background:var(--deep);
  color:white;
  text-align:center;
  padding:10px;
  font-size:10px;
  letter-spacing:1.2px;
  animation:topbarIn .8s ease both;
}

/* EN-TÊTE */

header{
  background:white;
  padding:17px 7%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #f0ebf3;
  position:sticky;
  top:0;
  z-index:100;
  transition:box-shadow .35s,background .35s;
}

header.scrolled{
  box-shadow:0 7px 25px rgba(48,36,59,.09);
}

.logo{
  font-size:23px;
  font-weight:700;
  letter-spacing:1px;
  color:var(--purple);
  transition:transform .3s;
}

.logo:hover{transform:scale(1.04)}
.logo span{color:var(--deep)}

nav{
  display:flex;
  align-items:center;
  gap:25px;
}

nav a{
  font-size:12px;
  font-weight:600;
  position:relative;
  transition:color .25s;
}

nav a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-7px;
  height:2px;
  width:0;
  background:var(--purple);
  transition:width .3s;
}

nav a:hover{color:var(--purple)}
nav a:hover::after{width:100%}

.menu-toggle{
  display:none;
  background:none;
  border:0;
  color:var(--deep);
  font-size:25px;
  padding:4px;
  transition:transform .3s;
}

/* ACCUEIL */

.hero{
  margin:24px auto;
  width:92%;
  min-height:490px;
  border-radius:7px;
  overflow:hidden;
  display:flex;
  align-items:center;
  position:relative;
  background:linear-gradient(90deg,rgba(30,20,38,.72),rgba(30,20,38,.08));
  color:white;
  isolation:isolate;
  transform-style:preserve-3d;
  box-shadow:0 22px 55px rgba(48,36,59,.15);
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-2;
  background:url('https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=1800&q=85') center 35%/cover;
  animation:heroZoom 17s ease-in-out infinite alternate;
  will-change:transform;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  background:linear-gradient(
    110deg,
    rgba(30,20,38,.82),
    rgba(60,35,75,.28),
    rgba(30,20,38,.08)
  );
  background-size:200% 100%;
  animation:heroLight 9s ease-in-out infinite alternate;
}

.hero-content{
  padding:55px 7%;
  max-width:650px;
  position:relative;
  z-index:2;
  transform:translateZ(35px);
}

.hero-content::before{
  content:"";
  position:absolute;
  left:0;
  top:12%;
  width:3px;
  height:76%;
  background:linear-gradient(transparent,#d9c2f0,transparent);
  transform-origin:top;
  animation:lineReveal 1.4s .3s both;
}

.eyebrow{
  display:inline-block;
  font-size:11px;
  letter-spacing:3px;
  text-transform:uppercase;
  font-weight:700;
  padding:9px 13px;
  border:1px solid rgba(255,255,255,.4);
  backdrop-filter:blur(8px);
  animation:fadeUp .9s .15s both;
}

h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(43px,6vw,72px);
  line-height:1.08;
  margin:22px 0;
  font-weight:600;
  text-shadow:0 5px 25px rgba(0,0,0,.2);
  animation:fadeUp .9s .35s both;
}

.hero p{
  max-width:420px;
  line-height:1.8;
  font-size:14px;
  margin-bottom:28px;
  animation:fadeUp .9s .55s both;
}

.button{
  display:inline-block;
  padding:15px 27px;
  background:var(--purple);
  color:white;
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  border:0;
  border-radius:4px;
  position:relative;
  overflow:hidden;
  box-shadow:0 8px 22px rgba(99,59,145,.22);
  transition:background .3s,transform .3s,box-shadow .3s;
  animation:fadeUp .9s .75s both;
}

.button::before{
  content:"";
  position:absolute;
  top:0;
  left:-120%;
  width:70%;
  height:100%;
  transform:skewX(-25deg);
  background:rgba(255,255,255,.2);
  transition:left .6s;
}

.button:hover::before{left:150%}

.button:hover{
  background:#4d2d72;
  transform:translateY(-4px);
  box-shadow:0 14px 30px rgba(99,59,145,.3);
}

.button:active{transform:scale(.96)}

/* ORBE DÉCORATIF */

.hero-orbit{
  position:absolute;
  width:220px;
  height:220px;
  right:9%;
  top:18%;
  border:1px solid rgba(255,255,255,.35);
  border-radius:50%;
  pointer-events:none;
  animation:orbitFloat 8s ease-in-out infinite;
}

.hero-orbit::before,
.hero-orbit::after{
  content:"";
  position:absolute;
  border:1px solid rgba(255,255,255,.25);
  border-radius:50%;
}

.hero-orbit::before{inset:22px}
.hero-orbit::after{
  inset:48px;
  background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);
}

.hero-orbit span{
  position:absolute;
  width:12px;
  height:12px;
  top:25px;
  right:35px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 22px #fff;
  animation:spark 3s ease-in-out infinite;
}

/* SECTIONS */

.section{padding:65px 7%}

.section-heading{
  text-align:center;
  margin-bottom:35px;
}

.section-heading small{
  color:var(--purple);
  letter-spacing:3px;
  font-weight:700;
  font-size:10px;
  text-transform:uppercase;
}

.section-heading h2{
  font-family:'Playfair Display',serif;
  font-size:35px;
  margin:12px 0;
  text-shadow:0 5px 18px rgba(99,59,145,.08);
}

.section-heading h2::after{
  content:"";
  display:block;
  width:65px;
  height:3px;
  border-radius:5px;
  margin:12px auto 0;
  background:var(--purple);
  transform-origin:center;
  animation:underlineGrow 1.1s .2s both;
}

.section-heading p{
  color:var(--muted);
  font-size:13px;
}

/* COLLECTIONS */

.categories{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.category{
  position:relative;
  height:300px;
  overflow:hidden;
  background:var(--lavender);
  cursor:pointer;
  display:block;
  border-radius:7px;
  transform-style:preserve-3d;
  backface-visibility:hidden;
  box-shadow:0 8px 24px rgba(48,36,59,.07);
  transition:transform .5s var(--ease),box-shadow .5s var(--ease);
}

.category img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .8s var(--ease),filter .5s;
}

.category:hover{
  transform:translateY(-7px);
  box-shadow:0 22px 42px rgba(48,36,59,.17);
}

.category:hover img{
  transform:scale(1.1);
  filter:brightness(.88);
}

.category-label{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:55px 20px 20px;
  color:white;
  background:linear-gradient(transparent,rgba(25,15,35,.8));
  transition:padding .35s;
  transform:translateZ(25px);
}

.category:hover .category-label{padding-bottom:27px}

.category-label h3{
  font-family:'Playfair Display',serif;
  font-size:25px;
  transition:transform .35s;
}

.category:hover .category-label h3{transform:translateX(5px)}

.category-label span{
  font-size:11px;
  margin-top:5px;
  display:inline-block;
}

/* CATALOGUE */

.products-section{background:#fcfaff}

.catalog-tools{
  max-width:850px;
  margin:0 auto 30px;
  display:flex;
  flex-direction:column;
  gap:18px;
}

.search-box{
  position:relative;
  width:100%;
}

.search-box input{
  width:100%;
  padding:15px 18px 15px 45px;
  border:1px solid var(--border);
  background:white;
  outline:none;
  font-size:13px;
  border-radius:3px;
  transition:border .3s,box-shadow .3s;
}

.search-box input:focus{
  border-color:var(--purple);
  box-shadow:0 0 0 4px rgba(99,59,145,.09);
}

.search-icon{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  font-size:18px;
  color:var(--muted);
}

.filters{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.filter-btn{
  border:1px solid #e7deef;
  background:white;
  color:var(--deep);
  padding:10px 17px;
  font-size:11px;
  border-radius:30px;
  transition:all .3s;
  position:relative;
  overflow:hidden;
}

.filter-btn:hover,
.filter-btn.active{
  background:var(--purple);
  color:white;
  border-color:var(--purple);
  transform:translateY(-2px);
  box-shadow:0 5px 13px rgba(99,59,145,.17);
}

.filter-btn:active{transform:scale(.95)}

.products-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.product-card{
  background:white;
  border:1px solid var(--border);
  overflow:hidden;
  border-radius:7px;
  transform-style:preserve-3d;
  backface-visibility:hidden;
  box-shadow:0 8px 25px rgba(48,36,59,.05);
  transition:transform .5s var(--ease),box-shadow .5s var(--ease);
}

.product-card:hover{
  transform:translateY(-8px);
  box-shadow:0 24px 45px rgba(48,36,59,.15);
}

.product-image{
  height:330px;
  background:var(--lavender);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  color:var(--purple);
  font-size:13px;
  line-height:1.7;
  transition:background .4s;
  position:relative;
  overflow:hidden;
}

.product-card:hover .product-image{background:#eee3f7}

.product-image span{
  display:block;
  font-size:35px;
  margin-bottom:10px;
  transition:transform .4s;
  animation:productGlow 3s ease-in-out infinite;
}

.product-card:hover .product-image span{
  transform:scale(1.2) rotate(-8deg);
}

.product-image::after{
  content:"";
  position:absolute;
  top:-60%;
  left:-100%;
  width:55%;
  height:220%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);
  transform:rotate(20deg);
  transition:left .9s ease;
  pointer-events:none;
}

.product-card:hover .product-image::after{left:150%}

.product-info{
  padding:20px;
  transform:translateZ(12px);
}

.product-category{
  color:var(--purple);
  font-size:9px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  font-weight:700;
}

.product-info h3{
  font-family:'Playfair Display',serif;
  font-size:21px;
  margin:9px 0 12px;
}

.product-description{
  color:var(--muted);
  font-size:12px;
  line-height:1.8;
  margin-bottom:17px;
}

.price-label{
  color:var(--purple);
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:8px;
}

.price-line{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:12px;
  padding:8px 0;
  border-bottom:1px solid #f1edf4;
}

.price-line strong{
  color:var(--deep);
  white-space:nowrap;
}

.product-detail{
  margin-top:15px;
  font-size:11px;
  line-height:2;
}

.product-detail strong{color:var(--purple)}

.product-status{
  display:inline-flex;
  align-items:center;
  gap:9px;
  margin-top:14px;
  background:var(--lavender);
  color:var(--purple);
  padding:8px 13px;
  border-radius:30px;
  font-size:10px;
  font-weight:700;
  transition:background .3s,transform .3s;
}

.product-status::before{
  content:"";
  width:8px;
  height:8px;
  flex-shrink:0;
  border-radius:50%;
  background:#35b879;
  box-shadow:0 0 0 0 rgba(53,184,121,.45);
  animation:availablePulse 2s infinite;
}

.product-card:hover .product-status{
  background:#e8d9f5;
  transform:translateY(-2px);
}

.empty-message{
  display:none;
  text-align:center;
  color:var(--muted);
  padding:35px;
  font-size:13px;
  grid-column:1/-1;
}

.product-note{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  line-height:1.8;
  margin-top:28px;
}

/* BANDEAU ANIMÉ */

.ms-marquee{
  overflow:hidden;
  width:100%;
  background:linear-gradient(90deg,#6d28d9,#9333ea,#6d28d9);
  color:white;
  padding:17px 0;
  margin:25px 0;
  transform:skewY(-1deg);
  box-shadow:0 10px 25px rgba(109,40,217,.18);
}

.ms-marquee-track{
  display:flex;
  width:max-content;
  gap:45px;
  white-space:nowrap;
  animation:marqueeMove 22s linear infinite;
  font-weight:700;
  letter-spacing:1.5px;
  font-size:13px;
}

.ms-marquee:hover .ms-marquee-track{
  animation-play-state:paused;
}

/* PROMOTION */

.promo{
  margin:15px 7% 65px;
  padding:55px 25px;
  text-align:center;
  background:var(--lavender);
  position:relative;
  overflow:hidden;
}

.promo::before,
.promo::after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border:1px solid rgba(99,59,145,.12);
  border-radius:50%;
  animation:floatCircle 8s ease-in-out infinite alternate;
}

.promo::before{top:-100px;left:-55px}
.promo::after{bottom:-120px;right:-50px;animation-delay:-4s}

.promo small{
  color:var(--purple);
  font-weight:700;
  letter-spacing:3px;
  font-size:10px;
}

.promo h2{
  font-family:'Playfair Display',serif;
  font-size:34px;
  margin:14px 0;
}

.promo p{
  color:var(--muted);
  font-size:13px;
  margin-bottom:22px;
}

/* À PROPOS */

.about{
  text-align:center;
  padding:60px 10%;
  border-top:1px solid #f0ebf3;
}

.about h2{
  font-family:'Playfair Display',serif;
  font-size:32px;
  margin-bottom:18px;
}

.about p{
  max-width:650px;
  margin:auto;
  color:var(--muted);
  line-height:1.9;
  font-size:14px;
}

/* AVANTAGES */

.benefits{
  background:#faf8fc;
  padding:30px 7%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  text-align:center;
}

.benefit{
  padding:22px 12px;
  border:1px solid transparent;
  border-radius:8px;
  transition:transform .35s,box-shadow .35s,background .35s;
}

.benefit:hover{
  background:white;
  border-color:var(--border);
  box-shadow:0 12px 28px rgba(48,36,59,.08);
  transform:translateY(-6px);
}

.benefit strong{
  display:block;
  font-size:13px;
  margin-bottom:7px;
}

.benefit span{
  color:var(--muted);
  font-size:11px;
}

/* PIED DE PAGE */

footer{
  background:var(--deep);
  color:white;
  padding:40px 7%;
  text-align:center;
}

footer .logo{color:#d9c2f0}
footer .logo span{color:white}

footer p{
  margin-top:13px;
  font-size:12px;
  color:#d4cbdc;
}

/* RETOUR EN HAUT */

.back-top{
  position:fixed;
  right:20px;
  bottom:20px;
  width:43px;
  height:43px;
  border:0;
  border-radius:50%;
  background:var(--purple);
  color:white;
  font-size:20px;
  box-shadow:0 5px 18px rgba(48,36,59,.2);
  opacity:0;
  visibility:hidden;
  transform:translateY(15px) scale(.8);
  transition:.35s;
  z-index:90;
}

.back-top.visible{
  opacity:1;
  visibility:visible;
  transform:translateY(0) scale(1);
}

.back-top:hover{transform:translateY(-5px) scale(1.08)}

/* APPARITION AU DÉFILEMENT */

.reveal{
  opacity:0;
  transform:translateY(35px);
  transition:opacity .85s ease,transform .85s var(--ease);
  transition-delay:var(--delay,0ms);
}

.reveal.show{
  opacity:1;
  transform:translateY(0);
}

.category.reveal,
.product-card.reveal{
  transform:translateY(35px) scale(.97);
}

.category.reveal.show,
.product-card.reveal.show{
  transform:translateY(0) scale(1);
}

/* BARRE DE PROGRESSION */

#msScrollProgress{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:4px;
  background:linear-gradient(90deg,#8b5cf6,#c084fc,#6d28d9);
  transform:scaleX(0);
  transform-origin:left;
  z-index:99999;
  pointer-events:none;
  transition:transform .12s linear;
}

/* ANIMATIONS */

@keyframes topbarIn{
  from{opacity:0;transform:translateY(-12px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(28px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes heroZoom{
  from{transform:scale(1)}
  to{transform:scale(1.09)}
}

@keyframes floatCircle{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(25px,-15px) scale(1.12)}
}

@keyframes ambientOne{
  from{transform:translate(0,0) scale(.9)}
  to{transform:translate(80px,35px) scale(1.2)}
}

@keyframes ambientTwo{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(-70px,-45px) scale(1.2)}
}

@keyframes lineReveal{
  from{transform:scaleY(0);opacity:0}
  to{transform:scaleY(1);opacity:1}
}

@keyframes underlineGrow{
  from{transform:scaleX(0)}
  to{transform:scaleX(1)}
}

@keyframes heroLight{
  from{background-position:0% 50%}
  to{background-position:100% 50%}
}

@keyframes orbitFloat{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-20px) rotate(12deg)}
}

@keyframes spark{
  0%,100%{opacity:.55;transform:scale(.8)}
  50%{opacity:1;transform:scale(1.35)}
}

@keyframes availablePulse{
  0%{box-shadow:0 0 0 0 rgba(53,184,121,.45)}
  70%{box-shadow:0 0 0 8px rgba(53,184,121,0)}
  100%{box-shadow:0 0 0 0 rgba(53,184,121,0)}
}

@keyframes productGlow{
  0%,100%{filter:drop-shadow(0 0 0 rgba(139,92,246,0))}
  50%{filter:drop-shadow(0 5px 12px rgba(139,92,246,.35))}
}

@keyframes marqueeMove{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

/* MENU MOBILE */

@media(max-width:700px){

  header{padding:15px 5%}
  .logo{font-size:19px}
  .menu-toggle{display:block}

  nav{
    display:flex;
    position:absolute;
    top:100%;
    left:0;
    right:0;
    background:white;
    padding:0 5%;
    flex-direction:column;
    align-items:flex-start;
    gap:0;
    border-bottom:0;
    box-shadow:0 10px 20px rgba(48,36,59,.06);
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:max-height .4s ease,opacity .35s,padding .4s;
  }

  nav.open{
    max-height:300px;
    opacity:1;
    padding:20px 5%;
    border-bottom:1px solid var(--border);
  }

  nav a{
    font-size:13px;
